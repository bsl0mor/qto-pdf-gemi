                                <span style={{fontSize:9,color:C.t2,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.description}</span>
                                {hasQty ? (
                                  <span style={{fontSize:11,fontWeight:700,color:C.t1,flexShrink:0}}>
                                    {Number(item.totalQty).toFixed(2)}<span style={{fontSize:8,color:C.t4,fontWeight:400,marginLeft:2}}>{item.unit}</span>
                                  </span>
                                ) : (
                                  <span style={{fontSize:9,color:C.amber,flexShrink:0}}>⏳</span>
                                )}
                                <span style={{
                                  fontSize:9,flexShrink:0,display:"inline-block",
                                  color:isPinned?C.primaryLight:C.t4,
                                  transition:"transform 0.15s",
                                  transform:isExpanded?"rotate(180deg)":"rotate(0deg)",
                                  marginLeft:2,
                                }}>▾</span>
                              </div>

                              {/* Expanded detail panel */}
                              {isExpanded && (
                                <div style={{padding:"0 10px 12px",borderTop:"1px solid rgba(255,255,255,0.07)",animation:"fadeIn 0.12s ease"}}>

                                  {/* Formula */}
                                  {formula && (
                                    <div style={{marginTop:9,marginBottom:9}}>
                                      <div style={{fontSize:8,color:C.t4,letterSpacing:1.5,marginBottom:5,fontWeight:700}}>FORMULA</div>
                                      <div style={{fontSize:9,color:C.primaryLight,fontFamily:"'Courier New',monospace",lineHeight:1.7,background:"rgba(99,102,241,0.09)",borderRadius:6,padding:"7px 10px",wordBreak:"break-all"}}>
                                        {formula.formula}
                                      </div>
                                      <div style={{fontSize:8,color:C.t4,marginTop:4,lineHeight:1.6}}>{formula.description}</div>
                                    </div>
                                  )}

                                  {/* Element-by-element calculations */}
                                  {hasElems && (
                                    <div style={{marginBottom:9}}>
                                      <div style={{fontSize:8,color:C.t4,letterSpacing:1.5,marginBottom:5,fontWeight:700}}>CALCULATION STEPS</div>
                                      {item.elements.map((el, ei) => (
                                        <div key={ei} style={{display:"flex",gap:7,padding:"5px 8px",borderRadius:5,background:"rgba(255,255,255,0.035)",marginBottom:3,alignItems:"flex-start"}}>
                                          <span style={{color:C.primaryLight,fontWeight:700,fontSize:9,flexShrink:0,minWidth:32,paddingTop:1}}>
                                            {el.mark}{el.count>1?` ×${el.count}`:""}
                                          </span>
                                          <div style={{flex:1,minWidth:0}}>
                                            {el.calc ? (
                                              <div style={{fontSize:8,color:C.t3,fontFamily:"'Courier New',monospace",lineHeight:1.6,wordBreak:"break-all"}}>{el.calc}</div>
                                            ) : (
                                              <div style={{fontSize:8,color:C.t3}}>
                                                {Object.entries(el).filter(([k])=>!["mark","count","subQty","calc"].includes(k)).map(([k,v])=>`${k}=${v}`).join(", ")}
                                              </div>
                                            )}
                                            {el.subQty !== undefined && (
                                              <div style={{fontSize:9,color:C.t2,fontWeight:600,marginTop:2}}>→ {Number(el.subQty).toFixed(2)} {item.unit}</div>
                                            )}
                                          </div>
                                        </div>
                                      ))}
                                    </div>
                                  )}

                                  {/* Breakdown summary */}
                                  {item.breakdown && (
                                    <div style={{fontSize:9,color:C.t3,lineHeight:1.7,borderTop:"1px solid rgba(255,255,255,0.06)",paddingTop:7,marginTop:4,wordBreak:"break-word"}}>
                                      {item.breakdown}
                                    </div>
                                  )}

                                  {/* Pending — inputs required */}
                                  {!hasQty && (
                                    <div style={{marginTop:9}}>
                                      <div style={{fontSize:8,color:C.amber,letterSpacing:1.5,marginBottom:7,fontWeight:700}}>⏳ INPUTS REQUIRED</div>
                                      {relQ.length > 0 ? relQ.map(q => (
                                        <div key={q.id} style={{marginBottom:10,padding:"8px 10px",borderRadius:7,background:"rgba(245,158,11,0.06)",border:"1px solid rgba(245,158,11,0.2)"}}>
                                          <div style={{fontSize:9,color:C.t2,lineHeight:1.7,marginBottom:3}}>{q.text}</div>
                                          <div style={{fontSize:8,color:C.t4,marginBottom:6}}>Typical: {q.typicalRange}</div>
                                          <div style={{display:"flex",gap:5}}>
                                            <input type="text"
                                              value={selectedDrawing.answers[q.id]??""}
                                              onChange={e=>updateDrawing(selectedDrawing.id,{answers:{...selectedDrawing.answers,[q.id]:e.target.value}})}
                                              placeholder={q.suggested||"Enter value"}
                                              style={{...inp,flex:1,fontSize:12,padding:"5px 9px",borderColor:"rgba(245,158,11,0.3)"}}
                                              onFocus={e=>e.target.style.borderColor=C.amber}
                                              onBlur={e=>e.target.style.borderColor="rgba(245,158,11,0.3)"}
                                            />
                                            {q.unit&&<span style={{fontSize:9,color:C.amber,padding:"5px 10px",background:"rgba(245,158,11,0.08)",borderRadius:7,border:"1px solid rgba(245,158,11,0.25)",flexShrink:0}}>{q.unit}</span>}
                                          </div>
                                        </div>
                                      )) : item.missingInputs?.length > 0 && (
                                        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                                          {item.missingInputs.map((mi,i)=>(
                                            <span key={i} style={{fontSize:8,color:C.amber,background:"rgba(245,158,11,0.1)",border:"1px solid rgba(245,158,11,0.25)",padding:"2px 8px",borderRadius:4}}>{mi}</span>
                                          ))}
                                        </div>
                                      )}
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    )}

                    {/* Questions form */}
                    {selectedDrawing.status === "questions" && selectedDrawing.analysis?.questions?.length > 0 && (
                      <div style={{background:C.primaryDim,border:`1px solid ${C.primaryBorder}`,borderRadius:12,padding:16,marginBottom:12}}>
                        <div style={{fontSize:9,color:C.primaryLight,letterSpacing:2.5,marginBottom:14,fontWeight:700}}>
                          ✦ INPUT REQUIRED
                        </div>
                        {selectedDrawing.analysis.questions.map((q,qi) => (
                          <div key={q.id} style={{marginBottom: qi < selectedDrawing.analysis.questions.length-1 ? 18 : 0}}>
                            <div style={{fontSize:10,color:C.t1,lineHeight:1.7,marginBottom:3,fontWeight:500}}>
                              <span style={{color:C.primaryLight,marginRight:5,fontWeight:700}}>Q{qi+1}.</span>{q.text}
                            </div>
                            <div style={{fontSize:9,color:C.t4,marginBottom:8,lineHeight:1.5}}>
                              Typical: {q.typicalRange}
                            </div>
                            <div style={{display:"flex",gap:6,alignItems:"center"}}>
                              <input
                                type="text"
                                value={selectedDrawing.answers[q.id] ?? ""}
                                onChange={e => updateDrawing(selectedDrawing.id, { answers: { ...selectedDrawing.answers, [q.id]: e.target.value } })}
                                placeholder={q.suggested || "Enter value"}
                                style={{...inp,flex:1,borderColor:C.primaryBorder,fontSize:14,fontWeight:600}}
                                onFocus={e => e.target.style.borderColor = C.primary}
                                onBlur={e => e.target.style.borderColor = C.primaryBorder}
                              />
                              {q.unit && (
                                <span style={{fontSize:10,color:C.t3,background:"rgba(255,255,255,0.06)",padding:"10px 12px",border:"1px solid rgba(255,255,255,0.1)",borderRadius:8}}>{q.unit}</span>
                              )}
                            </div>
                          </div>
                        ))}
                        <button className="action-btn" onClick={() => submitAnswers(selectedDrawing)} disabled={isProcessing}
                          style={{
                            width:"100%",marginTop:16,
                            background: isProcessing ? "rgba(255,255,255,0.05)" : `linear-gradient(135deg, ${C.primary}, ${C.primaryLight})`,
                            padding:13,color: isProcessing ? C.t4 : "#fff",
                            fontSize:9,letterSpacing:2.5,fontWeight:800,
                            cursor: isProcessing ? "not-allowed" : "pointer",
                            boxShadow: isProcessing ? "none" : "0 4px 20px rgba(99,102,241,0.35)",
                          }}>
                          {isProcessing ? "CALCULATING…" : "CALCULATE ALL →"}
                        </button>
                      </div>
                    )}

                    {/* Observed Elements */}
                    {selectedDrawing.analysis?.observedElements?.length > 0 && (
                      <div>
                        <div style={{fontSize:9,color:C.t4,letterSpacing:2,marginBottom:8,fontWeight:600}}>ELEMENTS</div>
                        <div style={{borderRadius:10,overflow:"hidden",border:"1px solid rgba(255,255,255,0.06)"}}>
                          {selectedDrawing.analysis.observedElements.map((el,i) => (
                            <div key={i} className="item-row" style={{
                              display:"flex",alignItems:"center",gap:8,
                              padding:"8px 10px",fontSize:10,
                              borderBottom: i < selectedDrawing.analysis.observedElements.length-1 ? "1px solid rgba(255,255,255,0.04)" : "none"
                            }}>
                              <span style={{color:C.primaryLight,minWidth:28,fontWeight:700}}>{el.mark||"—"}</span>
                              <span style={{color:C.t4,minWidth:22}}>×{el.count}</span>
                              <span style={{color:C.t2,flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{el.type}</span>
                              {el.dims && (
                                <span style={{color:C.t4,fontSize:9}}>
                                  {el.dims.L}×{el.dims.W}×{el.dims.H}
                                </span>
                              )}
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </>
              ) : (
                <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,opacity:0.3}}>
                  <div style={{fontSize:40}}>◧</div>
                  <div style={{fontSize:10,letterSpacing:2,color:C.t3,textAlign:"center"}}>SELECT A DRAWING<br/>TO VIEW ANALYSIS</div>
                </div>
              )}
            </div>
          )}

          {/* ══════════════════════════════════════════════════
              BOTTOM PANEL — QTO TABLE / FORMULAS (floating)
          ══════════════════════════════════════════════════ */}
          {bottomOpen && (
            <div className="glass" style={{
              position:"absolute",bottom:10,left:10,right:10,zIndex:20,
              height:200,borderRadius:14,
              display:"flex",flexDirection:"column",overflow:"hidden",
              animation:"slideUp 0.25s ease",
            }}>
              {/* Bottom tab bar */}
              <div style={{
                display:"flex",alignItems:"center",padding:"8px 14px",gap:4,
                borderBottom:"1px solid rgba(255,255,255,0.06)",flexShrink:0,
              }}>
                {[
                  {id:"table", label:`QTO TABLE (${qtoTable.length})`},
                  {id:"formulas", label:`FORMULAS (${Object.keys(formulas).length})`},
                  {id:"compare", label:"COMPARE"},
                ].map(t => (
                  <button key={t.id} onClick={() => setBottomMode(t.id)}
                    style={{
                      background: bottomMode===t.id ? C.primaryDim : "transparent",
                      border: bottomMode===t.id ? `1px solid ${C.primaryBorder}` : "1px solid transparent",
                      color: bottomMode===t.id ? C.primaryLight : C.t4,
                      padding:"5px 14px",borderRadius:8,cursor:"pointer",
                      fontSize:9,letterSpacing:1.5,fontWeight:bottomMode===t.id?700:400,
                      fontFamily:"inherit",transition:"all 0.15s"
                    }}>
                    {t.label}
                  </button>
                ))}
                <div style={{flex:1}}/>
                {bottomMode==="table" && qtoTable.length > 0 && (
                  <>
                    <button className="action-btn" onClick={exportPDFReport}
                      style={{background:C.primaryDim,border:`1px solid ${C.primaryBorder}`,padding:"5px 14px",color:C.primaryLight,fontSize:8,letterSpacing:2,marginRight:4}}>
                      📄 PDF REPORT
                    </button>
                    <button className="action-btn" onClick={exportCSV}
                      style={{background:C.greenDim,border:`1px solid ${C.greenBorder}`,padding:"5px 14px",color:C.green,fontSize:8,letterSpacing:2}}>
                      EXPORT CSV ↓
                    </button>
                  </>
                )}
                {bottomMode==="formulas" && (
                  <button className="action-btn" onClick={() => { setFormulas(DEFAULT_FORMULAS); setEditingKey(null); }}
                    style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",padding:"5px 14px",color:C.t3,fontSize:8,letterSpacing:2}}>
                    RESET ALL
                  </button>
                )}
                <button onClick={() => setBottomOpen(false)}
                  style={{background:"transparent",border:"none",color:C.t4,cursor:"pointer",fontSize:16,lineHeight:1,padding:"2px 6px"}}>✕</button>
              </div>

              {/* Table content */}
              {bottomMode === "table" && (
                <div style={{flex:1,overflow:"auto"}}>
                  {qtoTable.length === 0 ? (
                    <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",opacity:0.3}}>
                      <span style={{fontSize:10,letterSpacing:2,color:C.t3}}>ANALYZE DRAWINGS TO POPULATE TABLE</span>
                    </div>
                  ) : (
                    <table style={{width:"100%",borderCollapse:"collapse",minWidth:800}}>
                      <thead>
                        <tr>
                          {["DRAWING","TYPE","DISC","CODE","DESCRIPTION","UNIT","QTY"].map((h,i) => (
                            <th key={h} style={{
                              padding:"8px 14px",fontSize:8,letterSpacing:2,
                              color:C.t4,fontWeight:600,
                              textAlign:i===6?"right":"left",
                              position:"sticky",top:0,
                              background:"rgba(15,23,42,0.95)",
                              backdropFilter:"blur(8px)",
                              borderBottom:"1px solid rgba(255,255,255,0.08)",
                            }}>{h}</th>
                          ))}
                        </tr>
                      </thead>
                      <tbody>
                        {Array.from(new Set(qtoTable.map(r=>r.drawingId))).flatMap(drawingId => {
                          const rows = qtoTable.filter(r => r.drawingId === drawingId);
                          return rows.map((row,i) => (
                            <tr key={row.rowId} className="item-row" style={{borderBottom:"1px solid rgba(255,255,255,0.03)"}}>
                              <td style={{padding:"7px 14px",fontSize:10,color:C.t3,maxWidth:130,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                                {i===0?row.drawingName.replace(/\.[^.]+$/,""):""}
                              </td>
                              <td style={{padding:"7px 14px",fontSize:9,color:C.t4}}>{row.drawingType}</td>
                              <td style={{padding:"7px 14px"}}>
                                <span style={{fontSize:8,color:DISC[row.discipline]||C.t4,letterSpacing:1,fontWeight:700,background:(DISC[row.discipline]||C.t4)+"18",padding:"2px 7px",borderRadius:4}}>
                                  {row.discipline}
                                </span>
                              </td>
                              <td style={{padding:"7px 14px",fontSize:9,color:C.primaryLight,fontWeight:700}}>{row.itemCode}</td>
                              <td style={{padding:"7px 14px",fontSize:10,color:C.t2,maxWidth:280}}>{row.description}</td>
                              <td style={{padding:"7px 14px",fontSize:9,color:C.t3}}>{row.unit}</td>
                              <td style={{padding:"7px 14px",textAlign:"right"}}>
                                <span style={{fontSize:13,fontWeight:800,color:C.t1}}>
                                  {row.qty!==null&&row.qty!==undefined?Number(row.qty).toFixed(2):"—"}
                                </span>
                              </td>
                            </tr>
                          ));
                        })}
                      </tbody>
                    </table>
                  )}
                </div>
              )}

              {/* Formulas content */}
              {bottomMode === "formulas" && (
                <div style={{flex:1,overflow:"auto",padding:"10px 14px"}}>
                  {/* Template Library */}
                  <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
                    <span style={{fontSize:8,color:C.t4,letterSpacing:2,fontWeight:700,alignSelf:"center",marginRight:4}}>TEMPLATES:</span>
                    {Object.entries(FORMULA_TEMPLATES).map(([k,t]) => (
                      <button key={k} className="action-btn" onClick={() => {
                          if (t.keys) {
                            setFormulas(Object.fromEntries(Object.entries(DEFAULT_FORMULAS).filter(([fk]) => t.keys.includes(fk))));
                          } else {
                            setFormulas(DEFAULT_FORMULAS);
                          }
                        }}
                        title={t.desc}
                        style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",padding:"4px 12px",color:C.t2,fontSize:9,letterSpacing:0.5,borderRadius:6}}>
                        {t.name}
                      </button>
                    ))}
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(340px, 1fr))",gap:8}}>
                    {Object.entries(formulas).map(([key,formula]) => (
                      <div key={key} className="item-row" style={{
                        background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.05)",
                        borderRadius:10,padding:"10px 14px",
                      }}>
                        {editingKey===key ? (
                          <div style={{display:"flex",flexDirection:"column",gap:6}}>
                            <div style={{display:"flex",gap:6}}>
                              <input value={formula.name} onChange={e=>setFormulas(p=>({...p,[key]:{...p[key],name:e.target.value}}))} style={{...inp,flex:1,fontSize:11,padding:"6px 10px"}} />
                              <input value={formula.unit} onChange={e=>setFormulas(p=>({...p,[key]:{...p[key],unit:e.target.value}}))} style={{...inp,width:50,fontSize:11,padding:"6px 10px"}} />
                            </div>
                            <textarea value={formula.formula} rows={1} onChange={e=>setFormulas(p=>({...p,[key]:{...p[key],formula:e.target.value}}))} style={{...inp,color:C.primaryLight,resize:"vertical",fontSize:10,padding:"6px 10px"}} />
                            <div style={{display:"flex",gap:4}}>
                              <button className="action-btn" onClick={()=>setEditingKey(null)} style={{background:C.greenDim,border:`1px solid ${C.greenBorder}`,padding:"4px 12px",color:C.green,fontSize:8,letterSpacing:1}}>SAVE</button>
                              <button className="action-btn" onClick={()=>{setFormulas(p=>({...p,[key]:DEFAULT_FORMULAS[key]}));setEditingKey(null);}} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.1)",padding:"4px 12px",color:C.t3,fontSize:8,letterSpacing:1}}>RESET</button>
                            </div>
                          </div>
                        ) : (
                          <div style={{display:"flex",alignItems:"center",gap:10}}>
                            <span style={{fontSize:7,color:DISC[formula.category]||C.t4,fontWeight:700,letterSpacing:0.5,minWidth:24}}>{formula.category.slice(0,3)}</span>
                            <div style={{flex:1,minWidth:0}}>
                              <span style={{fontSize:10,color:C.t1,fontWeight:600}}>{formula.name}</span>
                              <span style={{fontSize:8,color:C.t4,marginLeft:6}}>{formula.unit}</span>
                              <div style={{fontSize:9,color:C.primaryLight,marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{formula.formula}</div>
                            </div>
                            <button className="action-btn" onClick={()=>setEditingKey(key)}
                              style={{background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.1)",padding:"3px 10px",color:C.t3,fontSize:8,letterSpacing:1,flexShrink:0}}>
                              EDIT
                            </button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* Compare content */}
              {bottomMode === "compare" && (
                <div style={{flex:1,overflow:"auto",padding:"12px 14px"}}>
                  <div style={{display:"flex",gap:12,marginBottom:14,alignItems:"center"}}>
                    <select value={compareDrawings[0]||""} onChange={e=>setCompareDrawings(p=>[e.target.value,p[1]])}
                      style={{...inp,flex:1,fontSize:11,padding:"7px 10px",cursor:"pointer"}}>
                      <option value="">— Drawing A —</option>
                      {drawings.filter(d=>d.status==="complete").map(d=><option key={d.id} value={d.id}>{d.name.replace(/\.[^.]+$/,"")}</option>)}
                    </select>
                    <span style={{color:C.t3,fontSize:12,fontWeight:800}}>vs</span>
                    <select value={compareDrawings[1]||""} onChange={e=>setCompareDrawings(p=>[p[0],e.target.value])}
                      style={{...inp,flex:1,fontSize:11,padding:"7px 10px",cursor:"pointer"}}>
                      <option value="">— Drawing B —</option>
                      {drawings.filter(d=>d.status==="complete").map(d=><option key={d.id} value={d.id}>{d.name.replace(/\.[^.]+$/,"")}</option>)}
                    </select>
                  </div>
                  {compareDrawings[0] && compareDrawings[1] && (() => {
                    const aRows = qtoTable.filter(r=>r.drawingId===compareDrawings[0]);
                    const bRows = qtoTable.filter(r=>r.drawingId===compareDrawings[1]);
                    const allCodes = [...new Set([...aRows.map(r=>r.itemCode),...bRows.map(r=>r.itemCode)])];
                    if (allCodes.length === 0) return <div style={{fontSize:10,color:C.t4,textAlign:"center",padding:20}}>No items to compare</div>;
                    return (
                      <table style={{width:"100%",borderCollapse:"collapse"}}>
                        <thead><tr>
                          {["CODE","DESCRIPTION","UNIT","QTY A","QTY B","DIFF","% DIFF"].map((h,i)=>(
                            <th key={h} style={{padding:"7px 12px",fontSize:8,letterSpacing:2,color:C.t4,fontWeight:600,textAlign:i>=3?"right":"left",position:"sticky",top:0,background:"rgba(15,23,42,0.95)",borderBottom:"1px solid rgba(255,255,255,0.08)"}}>{h}</th>
                          ))}
                        </tr></thead>
                        <tbody>
                          {allCodes.map(code => {
                            const ra = aRows.find(r=>r.itemCode===code);
                            const rb = bRows.find(r=>r.itemCode===code);
                            const qa = Number(ra?.qty||0), qb = Number(rb?.qty||0);
                            const diff = qb - qa;
                            const pctVal = qa !== 0 ? ((diff/qa)*100) : (qb !== 0 ? 100 : 0);
                            const clr = diff > 0.01 ? C.amber : diff < -0.01 ? C.green : C.t3;
                            return (
                              <tr key={code} style={{borderBottom:"1px solid rgba(255,255,255,0.03)"}}>
                                <td style={{padding:"6px 12px",fontSize:9,color:C.primaryLight,fontWeight:700}}>{code}</td>
                                <td style={{padding:"6px 12px",fontSize:10,color:C.t2}}>{(ra||rb)?.description||""}</td>
                                <td style={{padding:"6px 12px",fontSize:9,color:C.t3}}>{(ra||rb)?.unit||""}</td>
                                <td style={{padding:"6px 12px",fontSize:11,fontWeight:700,color:C.t1,textAlign:"right"}}>{qa.toFixed(2)}</td>
                                <td style={{padding:"6px 12px",fontSize:11,fontWeight:700,color:C.t1,textAlign:"right"}}>{qb.toFixed(2)}</td>
                                <td style={{padding:"6px 12px",fontSize:11,fontWeight:800,color:clr,textAlign:"right"}}>{diff>0?"+":""}{diff.toFixed(2)}</td>
                                <td style={{padding:"6px 12px",fontSize:10,fontWeight:600,color:clr,textAlign:"right"}}>{pctVal.toFixed(1)}%</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    );
                  })()}
                </div>
              )}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<QTOSystem />);
  </script>
</body>
</html>
